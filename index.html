<script>
  // ============================================================
  // PARA SINCRONIZAR ENTRE DISPOSITIVOS (computador + celular):
  // 1. Crie um projeto gratuito em https://console.firebase.google.com
  // 2. No menu do projeto: Build > Firestore Database > Criar banco de dados
  //    (modo produção; qualquer região)
  // 3. No ícone de engrenagem > Configurações do projeto > Seus apps > Web (</>) 
  //    copie o objeto "firebaseConfig" gerado
  // 4. Cole os valores reais no lugar de "SUA_..." abaixo
  // 5. Em Firestore > Regras, cole a regra sugerida no final deste arquivo
  //    (comentário FIRESTORE_RULES) e publique
  // Enquanto os campos abaixo não forem preenchidos, o app usa localStorage
  // (dados ficam só neste navegador, como antes).
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA8wR_wNcT6CGj0Lsw7DYTReyvvSp18dDs",
    authDomain: "to-dos-guidolin.firebaseapp.com",
    projectId: "to-dos-guidolin",
    storageBucket: "to-dos-guidolin.firebasestorage.app",
    messagingSenderId: "893525704242",
    appId: "1:893525704242:web:2bf5eef11e3dfb85cc862b",
  };

  const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "SUA_API_KEY";
  let db = null;
  let docRef = null;
  if (FIREBASE_CONFIGURED) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection("meus-todos-app").doc("mandato-data-v1");
  }

  window.storage = {
    async get(key) {
      if (docRef) {
        const snap = await docRef.get();
        if (!snap.exists) return null;
        return { key, value: snap.data().value, shared: false };
      }
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      if (docRef) {
        await docRef.set({ value, updatedAt: Date.now() });
        return { key, value, shared: false };
      }
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      if (docRef) {
        await docRef.delete();
        return { key, deleted: true, shared: false };
      }
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = FIREBASE_CONFIGURED ? ["mandato-data-v1"] : Object.keys(localStorage);
      return { keys, prefix, shared: false };
    },
  };

  // Real-time sync: when another device changes the data, tell the app to reload.
  if (docRef) {
    let skipFirst = true;
    docRef.onSnapshot(() => {
      if (skipFirst) { skipFirst = false; return; } // app already loads it once on its own
      window.dispatchEvent(new CustomEvent("meus-todos-remote-update"));
    });
  }

  // FIRESTORE_RULES (cole em Firestore > Regras e publique):
  // rules_version = '2';

  //     match /meus-todos-app/mandato-data-v1 {
  //       allow read, write: if true;
  //     }
  //   }
  // }
</script>

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function pad3(n) {
  return String(n).padStart(3, "0");
}

function formatDue(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  const opts = sameYear
    ? { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }
    : { day: "2-digit", month: "short", year: "numeric" };
  return d.toLocaleString("pt-BR", opts).replace(".", "");
}

function isOverdue(iso, done) {
  if (!iso || done) return false;
  return new Date(iso).getTime() < Date.now();
}

function MeusToDos() {
  const [todos, setTodos] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState(null);
  const [loadFailed, setLoadFailed] = useState(false);

  const [activeFilter, setActiveFilter] = useState("all");
  const [activeSubFilter, setActiveSubFilter] = useState("all");
  const [starFilters, setStarFilters] = useState([]); // empty = show all; otherwise array of 1|2|3

  const [draftText, setDraftText] = useState("");
  const [draftDesc, setDraftDesc] = useState("");
  const [draftCategory, setDraftCategory] = useState(DEFAULT_CATEGORIES[0].id);
  const [draftSubcategory, setDraftSubcategory] = useState("");
  const [draftStars, setDraftStars] = useState(2);
  const [draftDue, setDraftDue] = useState("");
  const [showDueField, setShowDueField] = useState(false);
  const [showDescField, setShowDescField] = useState(false);

  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [editDesc, setEditDesc] = useState("");
  const [editCategory, setEditCategory] = useState("");
  const [editSubcategory, setEditSubcategory] = useState("");
  const [editStars, setEditStars] = useState(2);
  const [editDue, setEditDue] = useState("");

  const [listening, setListening] = useState(false);
  const [voiceSupported, setVoiceSupported] = useState(true);
  const recognitionRef = useRef(null);

  const [addingCategory, setAddingCategory] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [newCatColor, setNewCatColor] = useState(PALETTE[0].hex);

  const [addingSubFor, setAddingSubFor] = useState(null); // category id currently adding a subcategory to
  const [newSubName, setNewSubName] = useState("");

  const [manageOpen, setManageOpen] = useState(false);

  const photoInputRef = useRef(null);
  const [photoModalOpen, setPhotoModalOpen] = useState(false);
  const [photoProcessing, setPhotoProcessing] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [photoTasks, setPhotoTasks] = useState([]); // [{ id, text, checked }]
  const [photoImportCategory, setPhotoImportCategory] = useState("");
  const [photoImportSubcategory, setPhotoImportSubcategory] = useState("");
  const [photoImportStars, setPhotoImportStars] = useState(2);

  // Load
  async function loadData() {
    let res = null;
    let hadError = false;
    try {
      res = await window.storage.get(STORAGE_KEY, false);
    } catch (e) {
      hadError = true;
    }
    if (hadError) {
      // could be a transient/network failure rather than "no data yet" — retry once
      await new Promise((r) => setTimeout(r, 800));
      try {
        res = await window.storage.get(STORAGE_KEY, false);
        hadError = false;
      } catch (e2) {
        hadError = true;
      }
    }
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        setTodos(parsed.todos || []);
        const loadedCats =
          parsed.categories && parsed.categories.length
            ? parsed.categories
            : DEFAULT_CATEGORIES;
        setCategories(
          loadedCats.map((c) => ({ ...c, subcategories: c.subcategories || [] }))
        );
        setError(null);
        setLoadFailed(false);
      } catch (e) {
        // corrupted payload — leave defaults, don't crash
      }
    } else if (hadError) {
      setLoadFailed(true);
      setError(
        'Não foi possível carregar seus dados salvos agora. Toque em "tentar novamente" — evite adicionar itens até confirmar, para não sobrescrever o que já existe.'
      );
    } else {
      setLoadFailed(false);
    }
    setLoaded(true);
  }

  useEffect(() => {
    loadData();
  }, []);

  // Save (skip the very first render before load completes)
  const saveTimerRef = useRef(null);
  const savePayloadRef = useRef(null);

  async function persist(payload) {
    if (!window.storage || typeof window.storage.set !== "function") {
      setError("Armazenamento indisponível neste ambiente. Abra o artifact direto no app ou site do Claude para salvar.");
      return;
    }
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(payload), false);
      setError(null);
    } catch (e) {
      // one retry after a short pause — covers transient/rate-limit failures
      await new Promise((r) => setTimeout(r, 800));
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(payload), false);
        setError(null);
      } catch (e2) {
        setError("Não foi possível salvar agora. Suas alterações ficam nesta tela — toque em \"tentar novamente\".");
      }
    }
  }

  useEffect(() => {
    if (!loaded || loadFailed) return;
    const payload = { todos, categories };
    savePayloadRef.current = payload;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      persist(payload);
    }, 400);
    return () => clearTimeout(saveTimerRef.current);
  }, [todos, categories, loaded]);

  function retrySave() {
    if (loadFailed) {
      loadData();
    } else if (savePayloadRef.current) {
      persist(savePayloadRef.current);
    }
  }

  // Voice setup
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setVoiceSupported(false);
      return;
    }
    const rec = new SR();
    rec.lang = "pt-BR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      const transcript = ev.results[0][0].transcript;
      setDraftText((prev) => (prev ? prev + " " + transcript : transcript));
    };
    rec.onerror = () => setListening(false);
    rec.onend = () => setListening(false);
    recognitionRef.current = rec;
  }, []);

  function toggleListening() {
    if (!voiceSupported || !recognitionRef.current) return;
    if (listening) {
      recognitionRef.current.stop();
      setListening(false);
    } else {
      try {
        recognitionRef.current.start();
        setListening(true);
      } catch (e) {
        setListening(false);
      }
    }
  }

  function addTodo() {
    const text = draftText.trim();
    if (!text) return;
    const todo = {
      id: uid(),
      text,
      description: draftDesc.trim() || null,
      category: draftCategory,
      subcategory: draftSubcategory || null,
      stars: draftStars,
      dueAt: draftDue || null,
      done: false,
      createdAt: new Date().toISOString(),
    };
    setTodos((prev) => [todo, ...prev]);
    setDraftText("");
    setDraftDesc("");
    setDraftSubcategory("");
    setDraftStars(2);
    setDraftDue("");
    setShowDueField(false);
    setShowDescField(false);
  }

  function openEdit(t) {
    setEditingId(t.id);
    setEditText(t.text);
    setEditDesc(t.description || "");
    setEditCategory(t.category);
    setEditSubcategory(t.subcategory || "");
    setEditStars(t.stars || 2);
    setEditDue(t.dueAt || "");
  }

  function closeEdit() {
    setEditingId(null);
  }

  function saveEdit() {
    const text = editText.trim();
    if (!text) return;
    setTodos((prev) =>
      prev.map((t) =>
        t.id === editingId
          ? {
              ...t,
              text,
              description: editDesc.trim() || null,
              category: editCategory,
              subcategory: editSubcategory || null,
              stars: editStars,
              dueAt: editDue || null,
            }
          : t
      )
    );
    setEditingId(null);
  }

  function toggleDone(id) {
    setTodos((prev) =>
      prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t))
    );
  }

  function removeTodo(id) {
    setTodos((prev) => prev.filter((t) => t.id !== id));
  }

  function addCategory() {
    const name = newCatName.trim();
    if (!name) return;
    const cat = { id: uid(), name, color: newCatColor, subcategories: [] };
    setCategories((prev) => [...prev, cat]);
    setDraftCategory(cat.id);
    setDraftSubcategory("");
    setNewCatName("");
    setAddingCategory(false);
  }

  function addSubcategory(categoryId) {
    const name = newSubName.trim();
    if (!name) return;
    const sub = { id: uid(), name };
    setCategories((prev) =>
      prev.map((c) =>
        c.id === categoryId
          ? { ...c, subcategories: [...(c.subcategories || []), sub] }
          : c
      )
    );
    if (editingId) {
      setEditSubcategory(sub.id);
    } else {
      setDraftSubcategory(sub.id);
    }
    setNewSubName("");
    setAddingSubFor(null);
  }

  function removeSubcategory(categoryId, subId) {
    setCategories((prev) =>
      prev.map((c) =>
        c.id === categoryId
          ? { ...c, subcategories: (c.subcategories || []).filter((s) => s.id !== subId) }
          : c
      )
    );
    setTodos((prev) =>
      prev.map((t) =>
        t.category === categoryId && t.subcategory === subId
          ? { ...t, subcategory: null }
          : t
      )
    );
  }

  function updateCategoryName(id, name) {
    setCategories((prev) =>
      prev.map((c) => (c.id === id ? { ...c, name } : c))
    );
  }

  function updateCategoryColor(id, hex) {
    setCategories((prev) =>
      prev.map((c) => (c.id === id ? { ...c, color: hex } : c))
    );
  }

  function updateSubcategoryName(categoryId, subId, name) {
    setCategories((prev) =>
      prev.map((c) =>
        c.id === categoryId
          ? {
              ...c,
              subcategories: (c.subcategories || []).map((s) =>
                s.id === subId ? { ...s, name } : s
              ),
            }
          : c
      )
    );
  }

  function moveSubcategory(categoryId, subId, direction) {
    setCategories((prev) =>
      prev.map((c) => {
        if (c.id !== categoryId) return c;
        const subs = c.subcategories || [];
        const index = subs.findIndex((s) => s.id === subId);
        const swapWith = direction === "up" ? index - 1 : index + 1;
        if (index < 0 || swapWith < 0 || swapWith >= subs.length) return c;
        const next = [...subs];
        [next[index], next[swapWith]] = [next[swapWith], next[index]];
        return { ...c, subcategories: next };
      })
    );
  }

  function openPhotoCapture() {
    if (photoInputRef.current) photoInputRef.current.click();
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result || "";
        const base64 = result.split(",")[1] || "";
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow selecting the same file again later
    if (!file) return;

    setPhotoModalOpen(true);
    setPhotoProcessing(true);
    setPhotoError(null);
    setPhotoTasks([]);
    setPhotoImportCategory(categories[0]?.id || "");
    setPhotoImportSubcategory("");
    setPhotoImportStars(2);

    try {
      const base64 = await fileToBase64(file);
      const res = await fetch(VISION_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, mediaType: file.type || "image/jpeg" }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        setPhotoError(
          "Não consegui ler a foto agora. Tente novamente com mais luz ou mais perto do texto."
        );
      } else {
        const tasks = (data.tasks || []).map((t) => ({
          id: uid(),
          text: t,
          checked: true,
        }));
        if (tasks.length === 0) {
          setPhotoError("Não encontrei nenhuma tarefa nessa foto.");
        }
        setPhotoTasks(tasks);
      }
    } catch (err) {
      setPhotoError("Falha de conexão ao analisar a foto. Verifique a internet e tente de novo.");
    } finally {
      setPhotoProcessing(false);
    }
  }

  function togglePhotoTask(id) {
    setPhotoTasks((prev) =>
      prev.map((t) => (t.id === id ? { ...t, checked: !t.checked } : t))
    );
  }

  function updatePhotoTaskText(id, text) {
    setPhotoTasks((prev) => prev.map((t) => (t.id === id ? { ...t, text } : t)));
  }

  function removePhotoTask(id) {
    setPhotoTasks((prev) => prev.filter((t) => t.id !== id));
  }

  function closePhotoModal() {
    setPhotoModalOpen(false);
    setPhotoTasks([]);
    setPhotoError(null);
  }

  function confirmPhotoImport() {
    const selected = photoTasks.filter((t) => t.checked && t.text.trim());
    if (selected.length === 0) {
      closePhotoModal();
      return;
    }
    const now = new Date().toISOString();
    const newTodos = selected.map((t) => ({
      id: uid(),
      text: t.text.trim(),
      description: null,
      category: photoImportCategory || null,
      subcategory: photoImportSubcategory || null,
      stars: photoImportStars,
      dueAt: null,
      done: false,
      createdAt: now,
    }));
    setTodos((prev) => [...newTodos, ...prev]);
    closePhotoModal();
  }

  function moveCategory(id, direction) {
    setCategories((prev) => {
      const index = prev.findIndex((c) => c.id === id);
      const swapWith = direction === "up" ? index - 1 : index + 1;
      if (index < 0 || swapWith < 0 || swapWith >= prev.length) return prev;
      const next = [...prev];
      [next[index], next[swapWith]] = [next[swapWith], next[index]];
      return next;
    });
  }

  function deleteCategory(id) {
    setCategories((prev) => prev.filter((c) => c.id !== id));
    setTodos((prev) =>
      prev.map((t) =>
        t.category === id ? { ...t, category: null, subcategory: null } : t
      )
    );
    if (draftCategory === id) {
      setDraftCategory("");
      setDraftSubcategory("");
    }
    if (activeFilter === id) {
      setActiveFilter("all");
      setActiveSubFilter("all");
    }
  }

  function toggleStarFilter(n) {
    setStarFilters((prev) =>
      prev.includes(n) ? prev.filter((x) => x !== n) : [...prev, n]
    );
  }

  const catMap = useMemo(() => {
    const m = {};
    categories.forEach((c) => (m[c.id] = c));
    return m;
  }, [categories]);

  const filtered = useMemo(() => {
    let list = todos;
    if (activeFilter !== "all") {
      list = list.filter((t) => t.category === activeFilter);
      if (activeSubFilter !== "all") {
        list = list.filter((t) => t.subcategory === activeSubFilter);
      }
    }
    if (starFilters.length > 0) {
      list = list.filter((t) => starFilters.includes(t.stars || 2));
    }
    return [...list].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.dueAt && b.dueAt) return new Date(a.dueAt) - new Date(b.dueAt);
      if (a.dueAt) return -1;
      if (b.dueAt) return 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
  }, [todos, activeFilter, activeSubFilter, starFilters]);

  const openCount = todos.filter((t) => !t.done).length;
  const overdueCount = todos.filter((t) => isOverdue(t.dueAt, t.done)).length;

  if (!loaded) {
    return (
      <div style={{ ...styles.root, alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: colors.textSecondary, fontFamily: fonts.mono, fontSize: 15 }}>
          Carregando pauta…
        </span>
      </div>
    );
  }

  return (
    <div className="app-root" style={styles.root}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,72,500;0,72,600;1,72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        button { color: inherit; -webkit-tap-highlight-color: transparent; }
        ::selection { background: ${colors.accent}55; }
        input::placeholder { color: ${colors.textFaint}; }
        .row-enter { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .strike { text-decoration: line-through; opacity: 0.45; transition: opacity 0.3s ease; }
        .mic-pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 ${colors.accent}55; } 50% { box-shadow: 0 0 0 8px ${colors.accent}00; } }
        .cat-btn:hover, .filter-btn:hover { filter: brightness(1.15); }
        .todo-row:hover { background: ${colors.panelHover}; }
        input[type="datetime-local"] { color-scheme: dark; }
        @media (prefers-reduced-motion: reduce) {
          .row-enter, .mic-pulse { animation: none; }
        }
        @media (max-width: 480px) {
          .app-root { padding: 16px 14px 32px !important; gap: 16px !important; }
          .app-title { font-size: 20px !important; }
          .header-row { flex-direction: row !important; align-items: center !important; gap: 8px !important; }
          .header-stats { gap: 12px !important; flex-shrink: 0; }
          .stat-num { font-size: 15px !important; }
          .stat-label { font-size: 9px !important; }
          .composer { padding: 12px !important; }
          .composer-row { flex-wrap: wrap !important; }
          .composer-row .app-input { flex: 1 1 100% !important; order: -1 !important; }
          .icon-btn { width: 34px !important; height: 34px !important; }
          .add-btn span { display: none; }
          .add-btn { padding: 0 12px !important; }
          .cat-chip { font-size: 10px !important; padding: 4px 8px !important; }
          .date-input { width: 100% !important; box-sizing: border-box; }
          .filter-bar { overflow-x: auto !important; flex-wrap: nowrap !important; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
          .filter-bar::-webkit-scrollbar { display: none; }
          .filter-chip { flex-shrink: 0 !important; }
          .hint-text { display: none !important; }
          .row { padding: 11px 2px !important; gap: 9px !important; }
          .row-text { font-size: 14px !important; }
          .modal { padding: 14px !important; max-width: 100% !important; }
        }
      `}</style>

      {/* Header */}
      <header className="header-row" style={styles.header}>
        <div>
          <h1 className="app-title" style={styles.title}>To-Dos LG</h1>
        </div>
        <div className="header-stats" style={styles.headerStats}>
          <div style={styles.statBlock}>
            <span className="stat-num" style={styles.statNum}>{pad3(openCount)}</span>
            <span className="stat-label" style={styles.statLabel}>em aberto</span>
          </div>
          {overdueCount > 0 && (
            <div style={{ ...styles.statBlock, color: colors.overdue }}>
              <span className="stat-num" style={{ ...styles.statNum, color: colors.overdue }}>
                {pad3(overdueCount)}
              </span>
              <span className="stat-label" style={{ ...styles.statLabel, color: colors.overdue }}>
                atrasados
              </span>
            </div>
          )}
        </div>
      </header>

      {/* Composer */}
      <div className="composer" style={styles.composer}>
        <div className="composer-row" style={styles.composerRow}>
          <input
            className="app-input"
            style={styles.input}
            placeholder="Novo item da pauta — descreva a ação…"
            value={draftText}
            onChange={(e) => setDraftText(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addTodo()}
          />
          {voiceSupported && (
            <button
              onClick={toggleListening}
              title="Ditar por voz"
              className={listening ? "icon-btn mic-pulse" : "icon-btn"}
              style={{
                ...styles.iconBtn,
                background: listening ? colors.accent : colors.panel,
                color: listening ? colors.base : colors.textSecondary,
              }}
            >
              <Mic size={19} />
            </button>
          )}
          <button
            onClick={() => setShowDescField((s) => !s)}
            title="Adicionar descrição"
            className="icon-btn"
            style={{
              ...styles.iconBtn,
              background: showDescField || draftDesc ? colors.accentDim : colors.panel,
              color: showDescField || draftDesc ? colors.accent : colors.textSecondary,
            }}
          >
            <AlignLeft size={19} />
          </button>
          <button
            onClick={() => setShowDueField((s) => !s)}
            title="Definir prazo"
            className="icon-btn"
            style={{
              ...styles.iconBtn,
              background: showDueField || draftDue ? colors.accentDim : colors.panel,
              color: showDueField || draftDue ? colors.accent : colors.textSecondary,
            }}
          >
            <Calendar size={19} />
          </button>
          <button
            onClick={openPhotoCapture}
            title="Importar tarefas de uma foto"
            className="icon-btn"
            style={{ ...styles.iconBtn, background: colors.panel, color: colors.textSecondary }}
          >
            <Camera size={19} />
          </button>
          <input
            ref={photoInputRef}
            type="file"
            accept="image/*"
            capture="environment"
            style={{ display: "none" }}
            onChange={handlePhotoSelected}
          />
          <div style={{ ...styles.iconBtn, background: colors.panel, padding: "0 8px", width: "auto" }}>
            <StarPicker value={draftStars} onChange={setDraftStars} size={18} />
          </div>
          <button onClick={addTodo} className="add-btn" style={styles.addBtn}>
            <Plus size={19} />
            <span>Adicionar</span>
          </button>
        </div>

        <div style={styles.composerRow2}>
          <div style={styles.catPicker}>
            {categories.map((c) => (
              <button
                key={c.id}
                className="cat-btn cat-chip"
                onClick={() => {
                  setDraftCategory(c.id);
                  setDraftSubcategory("");
                  setAddingSubFor(null);
                }}
                style={{
                  ...styles.catChip,
                  borderColor: draftCategory === c.id ? c.color : colors.border,
                  color: draftCategory === c.id ? c.color : colors.textSecondary,
                  background: draftCategory === c.id ? c.color + "1A" : "transparent",
                }}
              >
                {c.name}
              </button>
            ))}
            <button
              className="cat-btn cat-chip"
              onClick={() => setAddingCategory((s) => !s)}
              style={{ ...styles.catChip, borderStyle: "dashed", color: colors.textFaint }}
            >
              + categoria
            </button>
            <button
              className="cat-btn"
              onClick={() => setManageOpen(true)}
              title="Editar categorias"
              style={{ ...styles.catChip, display: "flex", alignItems: "center", padding: "5px 8px", color: colors.textFaint }}
            >
              <Settings size={18} />
            </button>
          </div>

          {showDueField && (
            <input
              type="datetime-local"
              className="date-input"
              value={draftDue}
              onChange={(e) => setDraftDue(e.target.value)}
              style={styles.dateInput}
            />
          )}
        </div>

        {catMap[draftCategory] && (
          <div style={styles.subPicker}>
            {(catMap[draftCategory]?.subcategories || []).map((s) => (
              <button
                key={s.id}
                className="cat-btn"
                onClick={() =>
                  setDraftSubcategory((prev) => (prev === s.id ? "" : s.id))
                }
                style={{
                  ...styles.subChip,
                  borderColor: draftSubcategory === s.id ? catMap[draftCategory].color : colors.border,
                  color: draftSubcategory === s.id ? catMap[draftCategory].color : colors.textFaint,
                  background: draftSubcategory === s.id ? catMap[draftCategory].color + "1A" : "transparent",
                }}
              >
                {s.name}
              </button>
            ))}
            {addingSubFor === draftCategory ? (
              <div style={styles.newCatRow}>
                <input
                  style={{ ...styles.input, flex: 1, padding: "6px 10px", fontSize: 14.5 }}
                  placeholder="Nome da subcategoria"
                  value={newSubName}
                  onChange={(e) => setNewSubName(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addSubcategory(draftCategory)}
                  autoFocus
                />
                <button onClick={() => addSubcategory(draftCategory)} style={styles.smallBtn}>
                  Criar
                </button>
                <button onClick={() => setAddingSubFor(null)} style={styles.smallBtnGhost}>
                  <X size={14} />
                </button>
              </div>
            ) : (
              <button
                className="cat-btn"
                onClick={() => setAddingSubFor(draftCategory)}
                style={{ ...styles.subChip, borderStyle: "dashed" }}
              >
                + subcategoria
              </button>
            )}
          </div>
        )}

        {showDescField && (
          <textarea
            style={styles.textarea}
            placeholder="Descrição — contexto, próximos passos, quem está envolvido…"
            value={draftDesc}
            onChange={(e) => setDraftDesc(e.target.value)}
            rows={2}
          />
        )}

        {addingCategory && (
          <div style={styles.newCatRow}>
            <input
              style={{ ...styles.input, flex: 1 }}
              placeholder="Nome da categoria"
              value={newCatName}
              onChange={(e) => setNewCatName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addCategory()}
              autoFocus
            />
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", maxWidth: 220 }}>
              {PALETTE.map((p) => (
                <button
                  key={p.id}
                  onClick={() => setNewCatColor(p.hex)}
                  style={{
                    width: 20,
                    height: 20,
                    borderRadius: "50%",
                    background: p.hex,
                    border: newCatColor === p.hex ? `2px solid ${colors.text}` : "2px solid transparent",
                    cursor: "pointer",
                  }}
                />
              ))}
            </div>
            <button onClick={addCategory} style={styles.smallBtn}>
              Criar
            </button>
            <button onClick={() => setAddingCategory(false)} style={styles.smallBtnGhost}>
              <X size={14} />
            </button>
          </div>
        )}

        {!voiceSupported && (
          <div style={styles.voiceWarning}>
            <AlertCircle size={12} />
            <span>Ditado por voz não é suportado neste navegador.</span>
          </div>
        )}
      </div>

      {/* Filters */}
      <div className="filter-bar" style={styles.filterBar}>
        <button
          className="filter-btn filter-chip"
          onClick={() => {
            setActiveFilter("all");
            setActiveSubFilter("all");
          }}
          style={{
            ...styles.filterChip,
            color: activeFilter === "all" ? colors.text : colors.textSecondary,
            borderBottomColor: activeFilter === "all" ? colors.accent : "transparent",
          }}
        >
          Todos
        </button>
        {categories.map((c) => (
          <button
            key={c.id}
            className="filter-btn filter-chip"
            onClick={() => {
              setActiveFilter(c.id);
              setActiveSubFilter("all");
            }}
            style={{
              ...styles.filterChip,
              color: activeFilter === c.id ? c.color : colors.textSecondary,
              borderBottomColor: activeFilter === c.id ? c.color : "transparent",
            }}
          >
            {c.name}
          </button>
        ))}
        <div style={{ flex: 1 }} />
        <span className="hint-text" style={styles.hintText}>toque num item para editar</span>
      </div>

      {activeFilter !== "all" && (catMap[activeFilter]?.subcategories || []).length > 0 && (
        <div className="filter-bar" style={styles.subFilterBar}>
          <button
            className="filter-btn filter-chip"
            onClick={() => setActiveSubFilter("all")}
            style={{
              ...styles.subFilterChip,
              color: activeSubFilter === "all" ? colors.text : colors.textFaint,
              borderColor: activeSubFilter === "all" ? colors.textSecondary : colors.border,
            }}
          >
            todas
          </button>
          {catMap[activeFilter].subcategories.map((s) => (
            <button
              key={s.id}
              className="filter-btn filter-chip"
              onClick={() => setActiveSubFilter(s.id)}
              style={{
                ...styles.subFilterChip,
                color: activeSubFilter === s.id ? catMap[activeFilter].color : colors.textFaint,
                borderColor: activeSubFilter === s.id ? catMap[activeFilter].color : colors.border,
              }}
            >
              {s.name}
            </button>
          ))}
        </div>
      )}

      <div className="filter-bar" style={styles.subFilterBar}>
        <span style={styles.starFilterLabel}>importância:</span>
        {[1, 2, 3].map((n) => {
          const active = starFilters.includes(n);
          return (
            <button
              key={n}
              className="filter-btn filter-chip"
              onClick={() => toggleStarFilter(n)}
              style={{
                ...styles.subFilterChip,
                display: "inline-flex",
                alignItems: "center",
                borderColor: active ? colors.accent : colors.border,
                background: active ? colors.accentDim : "transparent",
              }}
            >
              <StarDisplay value={n} size={14} />
            </button>
          );
        })}
      </div>

      {/* List */}
      <div style={styles.list}>
        {filtered.length === 0 && (
          <div style={styles.empty}>
            <span style={styles.emptyText}>Nenhum item aqui.</span>
            <span style={styles.emptySub}>A pauta está limpa — ou é hora de adicionar algo.</span>
          </div>
        )}
        {filtered.map((t, i) => {
          const cat = catMap[t.category];
          const overdue = isOverdue(t.dueAt, t.done);
          return (
            <div
              key={t.id}
              className="todo-row row-enter row"
              style={styles.row}
              onClick={() => openEdit(t)}
            >
              <span style={styles.rowIndex}>{pad3(i + 1)}</span>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  toggleDone(t.id);
                }}
                style={{
                  ...styles.checkbox,
                  borderColor: t.done ? colors.accent : colors.border,
                  background: t.done ? colors.accent : "transparent",
                }}
              >
                {t.done && <Check size={12} color={colors.base} strokeWidth={3} />}
              </button>
              <div style={styles.rowBody}>
                <div style={styles.rowTitleLine}>
                  <span className={t.done ? "strike row-text" : "row-text"} style={styles.rowText}>
                    {t.text}
                  </span>
                  <StarDisplay value={t.stars || 2} size={11} />
                </div>
                {t.description && (
                  <span className={t.done ? "strike" : ""} style={styles.rowDesc}>
                    {t.description}
                  </span>
                )}
                <div style={styles.rowMeta}>
                  {cat && (
                    <span style={{ ...styles.tag, borderColor: cat.color, color: cat.color }}>
                      {cat.name}
                    </span>
                  )}
                  {cat && t.subcategory && (
                    <span style={{ ...styles.tag, borderColor: colors.border, color: colors.textSecondary }}>
                      {(cat.subcategories || []).find((s) => s.id === t.subcategory)?.name || ""}
                    </span>
                  )}
                  {t.dueAt && (
                    <span
                      style={{
                        ...styles.dueTag,
                        color: overdue ? colors.overdue : colors.textSecondary,
                      }}
                    >
                      <Calendar size={11} />
                      {formatDue(t.dueAt)}
                    </span>
                  )}
                </div>
              </div>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  removeTodo(t.id);
                }}
                style={styles.deleteBtn}
              >
                <Trash2 size={14} />
              </button>
            </div>
          );
        })}
      </div>

      {error && (
        <div style={styles.errorBar}>
          <span>{error}</span>
          <button onClick={retrySave} style={styles.retryBtn}>
            tentar novamente
          </button>
        </div>
      )}

      {editingId && (
        <div style={styles.modalBackdrop} onClick={closeEdit}>
          <div className="modal" style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <span style={styles.modalEyebrow}>EDITAR ITEM</span>
              <button onClick={closeEdit} style={styles.smallBtnGhost}>
                <X size={14} />
              </button>
            </div>

            <label style={styles.fieldLabel}>Título</label>
            <input
              style={styles.input}
              value={editText}
              onChange={(e) => setEditText(e.target.value)}
              autoFocus
            />

            <label style={styles.fieldLabel}>Descrição</label>
            <textarea
              style={styles.textarea}
              rows={3}
              value={editDesc}
              onChange={(e) => setEditDesc(e.target.value)}
              placeholder="Contexto, próximos passos, quem está envolvido…"
            />

            <label style={styles.fieldLabel}>Categoria</label>
            <div style={styles.catPicker}>
              {categories.map((c) => (
                <button
                  key={c.id}
                  className="cat-btn"
                  onClick={() => {
                    setEditCategory(c.id);
                    setEditSubcategory("");
                    setAddingSubFor(null);
                  }}
                  style={{
                    ...styles.catChip,
                    borderColor: editCategory === c.id ? c.color : colors.border,
                    color: editCategory === c.id ? c.color : colors.textSecondary,
                    background: editCategory === c.id ? c.color + "1A" : "transparent",
                  }}
                >
                  {c.name}
                </button>
              ))}
            </div>

            {catMap[editCategory] && (
              <div style={styles.subPicker}>
                {(catMap[editCategory].subcategories || []).map((s) => (
                  <button
                    key={s.id}
                    className="cat-btn"
                    onClick={() =>
                      setEditSubcategory((prev) => (prev === s.id ? "" : s.id))
                    }
                    style={{
                      ...styles.subChip,
                      borderColor: editSubcategory === s.id ? catMap[editCategory].color : colors.border,
                      color: editSubcategory === s.id ? catMap[editCategory].color : colors.textFaint,
                      background: editSubcategory === s.id ? catMap[editCategory].color + "1A" : "transparent",
                    }}
                  >
                    {s.name}
                  </button>
                ))}
                {addingSubFor === editCategory ? (
                  <div style={styles.newCatRow}>
                    <input
                      style={{ ...styles.input, flex: 1, padding: "6px 10px", fontSize: 14.5 }}
                      placeholder="Nome da subcategoria"
                      value={newSubName}
                      onChange={(e) => setNewSubName(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && addSubcategory(editCategory)}
                      autoFocus
                    />
                    <button onClick={() => addSubcategory(editCategory)} style={styles.smallBtn}>
                      Criar
                    </button>
                    <button onClick={() => setAddingSubFor(null)} style={styles.smallBtnGhost}>
                      <X size={14} />
                    </button>
                  </div>
                ) : (
                  <button
                    className="cat-btn"
                    onClick={() => setAddingSubFor(editCategory)}
                    style={{ ...styles.subChip, borderStyle: "dashed" }}
                  >
                    + subcategoria
                  </button>
                )}
              </div>
            )}

            <label style={styles.fieldLabel}>Importância</label>
            <StarPicker value={editStars} onChange={setEditStars} size={18} />

            <label style={styles.fieldLabel}>Prazo</label>
            <input
              type="datetime-local"
              value={editDue}
              onChange={(e) => setEditDue(e.target.value)}
              style={{ ...styles.dateInput, width: "100%" }}
            />

            <div style={styles.modalActions}>
              <button
                onClick={() => {
                  removeTodo(editingId);
                  setEditingId(null);
                }}
                style={styles.modalDeleteBtn}
              >
                <Trash2 size={14} />
                <span>Excluir</span>
              </button>
              <div style={{ flex: 1 }} />
              <button onClick={closeEdit} style={styles.smallBtnGhost}>
                Cancelar
              </button>
              <button onClick={saveEdit} style={styles.smallBtn}>
                Salvar
              </button>
            </div>
          </div>
        </div>
      )}

      {manageOpen && (
        <div style={styles.modalBackdrop} onClick={() => setManageOpen(false)}>
          <div className="modal" style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <span style={styles.modalEyebrow}>EDITAR CATEGORIAS</span>
              <button onClick={() => setManageOpen(false)} style={styles.smallBtnGhost}>
                <X size={14} />
              </button>
            </div>

            {categories.length === 0 && (
              <span style={{ ...styles.rowDesc, padding: "8px 0" }}>
                Nenhuma categoria criada ainda.
              </span>
            )}

            {categories.map((c, idx) => (
              <div key={c.id} style={styles.manageCatBlock}>
                <div style={styles.manageCatRow}>
                  <div style={styles.reorderCol}>
                    <button
                      onClick={() => moveCategory(c.id, "up")}
                      disabled={idx === 0}
                      title="Mover para cima"
                      style={{ ...styles.reorderBtn, opacity: idx === 0 ? 0.3 : 1 }}
                    >
                      <ChevronUp size={14} />
                    </button>
                    <button
                      onClick={() => moveCategory(c.id, "down")}
                      disabled={idx === categories.length - 1}
                      title="Mover para baixo"
                      style={{ ...styles.reorderBtn, opacity: idx === categories.length - 1 ? 0.3 : 1 }}
                    >
                      <ChevronDown size={14} />
                    </button>
                  </div>
                  <input
                    style={{ ...styles.input, flex: 1 }}
                    value={c.name}
                    onChange={(e) => updateCategoryName(c.id, e.target.value)}
                  />
                  <button
                    onClick={() => deleteCategory(c.id)}
                    title="Excluir categoria"
                    style={styles.smallBtnGhost}
                  >
                    <Trash2 size={14} />
                  </button>
                </div>

                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", maxWidth: 220 }}>
                  {PALETTE.map((p) => (
                    <button
                      key={p.id}
                      onClick={() => updateCategoryColor(c.id, p.hex)}
                      style={{
                        width: 20,
                        height: 20,
                        borderRadius: "50%",
                        background: p.hex,
                        border: c.color === p.hex ? `2px solid ${colors.text}` : "2px solid transparent",
                        cursor: "pointer",
                      }}
                    />
                  ))}
                </div>

                {(c.subcategories || []).length > 0 && (
                  <div style={styles.manageSubList}>
                    {c.subcategories.map((s, sIdx) => (
                      <div key={s.id} style={styles.manageSubRow}>
                        <div style={styles.reorderCol}>
                          <button
                            onClick={() => moveSubcategory(c.id, s.id, "up")}
                            disabled={sIdx === 0}
                            title="Mover para cima"
                            style={{ ...styles.reorderBtn, opacity: sIdx === 0 ? 0.3 : 1 }}
                          >
                            <ChevronUp size={12} />
                          </button>
                          <button
                            onClick={() => moveSubcategory(c.id, s.id, "down")}
                            disabled={sIdx === c.subcategories.length - 1}
                            title="Mover para baixo"
                            style={{ ...styles.reorderBtn, opacity: sIdx === c.subcategories.length - 1 ? 0.3 : 1 }}
                          >
                            <ChevronDown size={12} />
                          </button>
                        </div>
                        <input
                          style={{ ...styles.input, flex: 1, padding: "6px 10px", fontSize: 14.5 }}
                          value={s.name}
                          onChange={(e) => updateSubcategoryName(c.id, s.id, e.target.value)}
                        />
                        <button
                          onClick={() => removeSubcategory(c.id, s.id)}
                          title="Excluir subcategoria"
                          style={styles.smallBtnGhost}
                        >
                          <X size={13} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}

            <div style={styles.modalActions}>
              <div style={{ flex: 1 }} />
              <button onClick={() => setManageOpen(false)} style={styles.smallBtn}>
                Concluído
              </button>
            </div>
          </div>
        </div>
      )}

      {photoModalOpen && (
        <div style={styles.modalBackdrop} onClick={closePhotoModal}>
          <div className="modal" style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>

            </div>

            {photoProcessing && (
              <span style={{ ...styles.rowDesc, padding: "12px 0" }}>

            )}

            {!photoProcessing && photoError && (
              <div style={styles.voiceWarning}>
                <AlertCircle size={13} />

              </div>
            )}

            {!photoProcessing && photoTasks.length > 0 && (
              <>
                <span style={{ ...styles.fieldLabel, marginTop: 0 }}>
                  ITENS ENCONTRADOS — desmarque o que não for tarefa
                </span>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {photoTasks.map((t) => (
                    <div key={t.id} style={styles.manageCatRow}>
                      <button
                        onClick={() => togglePhotoTask(t.id)}
                        style={{
                          ...styles.checkbox,
                          borderColor: t.checked ? colors.accent : colors.border,
                          background: t.checked ? colors.accent : "transparent",
                        }}
                      >
                        {t.checked && <Check size={12} color={colors.base} strokeWidth={3} />}
                      </button>
                      <input
                        style={{ ...styles.input, flex: 1 }}
                        value={t.text}
                        onChange={(e) => updatePhotoTaskText(t.id, e.target.value)}
                      />
                      <button onClick={() => removePhotoTask(t.id)} style={styles.smallBtnGhost}>
                        <X size={13} />
                      </button>
                    </div>
                  ))}
                </div>

                <label style={styles.fieldLabel}>Categoria (aplicada a todos)</label>
                <div style={styles.catPicker}>
                  {categories.map((c) => (
                    <button
                      key={c.id}
                      className="cat-btn"
                      onClick={() => {
                        setPhotoImportCategory(c.id);
                        setPhotoImportSubcategory("");
                      }}
                      style={{
                        ...styles.catChip,
                        borderColor: photoImportCategory === c.id ? c.color : colors.border,
                        color: photoImportCategory === c.id ? c.color : colors.textSecondary,
                        background: photoImportCategory === c.id ? c.color + "1A" : "transparent",
                      }}
                    >
                      {c.name}
                    </button>
                  ))}
                </div>

                {catMap[photoImportCategory] && (catMap[photoImportCategory].subcategories || []).length > 0 && (
                  <div style={styles.subPicker}>
                    {catMap[photoImportCategory].subcategories.map((s) => (
                      <button
                        key={s.id}
                        className="cat-btn"
                        onClick={() =>
                          setPhotoImportSubcategory((prev) => (prev === s.id ? "" : s.id))
                        }
                        style={{
                          ...styles.subChip,
                          borderColor: photoImportSubcategory === s.id ? catMap[photoImportCategory].color : colors.border,
                          color: photoImportSubcategory === s.id ? catMap[photoImportCategory].color : colors.textFaint,
                          background: photoImportSubcategory === s.id ? catMap[photoImportCategory].color + "1A" : "transparent",
                        }}
                      >
                        {s.name}
                      </button>
                    ))}
                  </div>
                )}

                <label style={styles.fieldLabel}>Importância (aplicada a todos)</label>
                <StarPicker value={photoImportStars} onChange={setPhotoImportStars} size={18} />

                <div style={styles.modalActions}>
                  <button onClick={closePhotoModal} style={styles.smallBtnGhost}>
                    Cancelar
                  </button>
                  <div style={{ flex: 1 }} />
                  <button onClick={confirmPhotoImport} style={styles.smallBtn}>
                    Importar {photoTasks.filter((t) => t.checked).length} itens
                  </button>
                </div>
              </>
            )}

            {!photoProcessing && photoTasks.length === 0 && (
              <div style={styles.modalActions}>
                <div style={{ flex: 1 }} />
                <button onClick={closePhotoModal} style={styles.smallBtnGhost}>
                  Fechar
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
